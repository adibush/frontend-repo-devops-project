name: Update Frontend Deployment in Infra Repo

on:
  workflow_run:
    workflows:
      - Build and Push Frontend Image
    types:
      - completed
    branches:
      - dev

jobs:
  update-infra:
    name: Update frontend image tag
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      INFRA_REPO: adibush/infra-repo-devops-project
      INFRA_BRANCH: dev
      TARGET_BRANCH: main
      DEPLOYMENT_FILE: kubernetes/deployments/frontend-deployment.yaml
      IMAGE_NAME: adibush/hotel-frontend
      APP_NAME: frontend
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Print pipeline context
        run: |
          set -euo pipefail
          echo "Pipeline 1 completed successfully."
          echo "Source workflow: ${{ github.event.workflow_run.name }}"
          echo "Source branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Source SHA: $IMAGE_TAG"
          echo "Application: $APP_NAME"
          echo "Infra repository: $INFRA_REPO"
          echo "Deployment file: $DEPLOYMENT_FILE"

      - name: Verify workflow belongs to frontend
        run: |
          set -euo pipefail
          if [ "${{ github.event.workflow_run.name }}" != "Build and Push Frontend Image" ]; then
            echo "This workflow is not the frontend build workflow."
            exit 1
          fi
          echo "Detected Frontend workflow."

      - name: Checkout infra repository dev branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          ref: ${{ env.INFRA_BRANCH }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo

      - name: Update frontend Kubernetes deployment image
        working-directory: infra-repo
        run: |
          set -euo pipefail
          echo "Before update:"
          grep "image: $IMAGE_NAME" "$DEPLOYMENT_FILE"

          sed -i -E "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" "$DEPLOYMENT_FILE"

          echo "After update:"
          grep "image: $IMAGE_NAME" "$DEPLOYMENT_FILE"

          if ! grep -q "image: ${IMAGE_NAME}:${IMAGE_TAG}" "$DEPLOYMENT_FILE"; then
            echo "Image update failed."
            exit 1
          fi

      - name: Commit and push manifest update
        working-directory: infra-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No manifest changes detected."
            exit 0
          fi

          git add "$DEPLOYMENT_FILE"
          git commit -m "Update frontend image to ${IMAGE_TAG}"
          git push origin "$INFRA_BRANCH"

      - name: Create pull request from dev to main
        id: create_pr
        working-directory: infra-repo
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list --repo "$INFRA_REPO" --head "$INFRA_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')"

          if [ -n "$existing_pr" ]; then
            echo "Pull request already exists: #$existing_pr"
            echo "pr_number=$existing_pr" >> "$GITHUB_OUTPUT"
          else
            pr_url="$(gh pr create \
              --repo "$INFRA_REPO" \
              --head "$INFRA_BRANCH" \
              --base "$TARGET_BRANCH" \
              --title "Update frontend image to ${IMAGE_TAG}" \
              --body "Pipeline 2 updated frontend-deployment.yaml to use image ${IMAGE_NAME}:${IMAGE_TAG}.")"

            pr_number="${pr_url##*/}"
            echo "Created pull request: #$pr_number"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$INFRA_REPO" --merge --delete-branch=false
